[package]
name = "api"
version = "0.1.0"
edition = "2021"

[dependencies]

dioxus = { workspace = true, features = ["fullstack", "router", "html"] }
dioxus-html = { version = "0.7.2", features = ["serialize"] }
axum = { version = "0.8.7", optional = true }

serde.workspace = true
serde_json = "1.0.114"

tracing = { version = "0", features = [
  "max_level_trace",
  "release_max_level_warn",
] }

structopt = { version = "0.3.26", optional = true }
tokio = { version = "1.48", features = ["rt", "rt-multi-thread", "macros", "signal"], optional = true }
shlex = "1.3.0"
ciborium = { version = "0.2.2", optional = true }
tower-sessions = { version = "0.14.0", optional = true }
axum-login = { version = "0.18.0", optional = true }
bytemuck = "1.24.0"

[features]
server = [
  "dioxus/server",
  "dep:axum",
  "dep:axum-login",
  "dep:tokio",
  "dep:tower-sessions",
  "dep:ciborium",
  "dep:structopt"
]
web = ["dioxus/web"]